<header><button class="gear" id="gear" onclick="settingsSheet()" aria-label="Settings">⚙︎</button><div><h1 id="ttl">Tempo</h1><div class="sub" id="sub"></div></div><div class="right"><div class="sync" id="sum"></div><div class="sync" id="syn" style="justify-content:flex-end"></div></div></header>

<script>
/* ================== CONFIGURATION - edit these first ================== */
const DRY_RUN = false;        /* false = actual writes to Google (create/patch/delete/upload) */
const USE_DUMMY_DATA = false;   /* false = read calendars, events, tasks and the Drive backup from Google */
const GOOGLE_CLIENT_ID = '929974204584-9mjhgim01rmm1ka0qeh84hnfu5cmelc2.apps.googleusercontent.com';   /* INSERT CLIENT ID */
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/drive.file';
const BACKUP_FILE = 'tempo-notes-backup.md';   /* name of the single notes backup file on Drive */
const $=s=>document.querySelector(s);
/* =========================================================================
   DATA LAYER  -  the ONLY place that talks to Google (Calendar, Tasks, Drive)
   ------------------------------------------------------------------------- */

/* ---- 1. Auth (Google Identity Services) ---------------------------------- */
let _token=null,_tokenExp=0;
function waitForGoogle(ms=5000){
  return new Promise((res,rej)=>{
    if(window.google&&google.accounts)return res();
    const t0=Date.now(),iv=setInterval(()=>{
      if(window.google&&google.accounts){clearInterval(iv);res()}
      else if(Date.now()-t0>ms){clearInterval(iv);rej(new Error('Google sign-in script timed out (tjek internet/AdBlocker)'))}
    },100);
  });
}
function getAccessToken(){
  return new Promise(async(resolve,reject)=>{
    if(_token&&Date.now()<_tokenExp)return resolve(_token);
    try{await waitForGoogle()}catch(e){return reject(e)}
    const client=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:GOOGLE_SCOPES,
      callback:r=>{
        if(r.error)return reject(new Error(r.error));
        _token=r.access_token;
        _tokenExp=Date.now()+(r.expires_in-60)*1000;
        const b=document.getElementById('g-login-btn');if(b)b.remove();
        resolve(_token);
      }
    });
    if(!document.getElementById('g-login-btn')){
      const btn=document.createElement('button');
      btn.id='g-login-btn';
      btn.className='btn';
      btn.style.cssText='margin:12px 16px;width:calc(100% - 32px);background:#2F6FED;color:#fff';
      btn.textContent='Log ind med Google';
      btn.onclick=()=>client.requestAccessToken();
      document.querySelector('header').after(btn);
    }
    client.requestAccessToken();
  });
}
async function googleRequest(method,url,body){
  if(DRY_RUN&&method!=='GET'){console.log('[DRY_RUN] '+method+' '+url,body||'');return{id:'dry-'+Math.random().toString(36).slice(2,9),dryRun:true}}
  const token=await getAccessToken();
  const res=await fetch(url,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error('Google API '+res.status+' on '+method+' '+url);
  return res.status===204?null:res.json();
}
function syncFail(e){console.error(e);toast('Sync failed: '+e.message)}

/* ---- 2. Shared state filled by initData() -------------------------------- */
let CAL={},L={},calIds={},listIds={},events=[],tasks=[];   /* CAL: name->colour, L: tag->colour, calIds/listIds: name->Google id */
async function initData(){
  try{
    CAL=await fetchCalendars();
    L=await fetchTaskLists();
    events=await fetchCalendarEvents();
    tasks=await fetchTasks();
