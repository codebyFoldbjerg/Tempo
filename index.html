.tk{height:26px;line-height:18px;background:color-mix(in srgb,var(--card) 88%,transparent)}

button.pill{width:100%;text-align:left;font:inherit;font-size:13px;color:inherit;display:block}.dn{cursor:pointer}

<script>

/* =========================================================================
   DATA LAYER  -  the ONLY place that talks to Google (Calendar, Tasks, Drive)
   -------------------------------------------------------------------------
   Safety rules built into this layer
   - APPEND / PATCH ONLY: events and tasks are created or patched one at a time.
     There is no bulk delete and no bulk overwrite anywhere in the app.
     The only DELETE calls are deleteCalendarEvent() and deleteTask(), each for ONE
     item the user explicitly deleted. The only overwrite is the single Drive backup file.
   - DRY_RUN = true: every write (POST / PATCH / DELETE / upload) is only logged to the
     console and nothing is sent. Reads (GET) still work.
   - USE_DUMMY_DATA = true: reads return the built-in demo data. Set to false to read
     from Google.

   App data model (what the UI expects)
   EVENT  {id, gid, t, cal, day:'YYYY-MM-DD', endDay:'YYYY-MM-DD' (inclusive, optional: missing = day), s:hours, e:hours, allDay, rec:'none|daily|weekly|monthly', loc, desc}
          id = local numeric id (UI only). gid = Google event id. s/e = hours, 9.5 = 09:30, e=24 = midnight.
          cal = calendar NAME (key in CAL). allDay events use s=0, e=24 and allDay:true.
   TASK   {id, gid, gl, t, tag, icon, p:0|1|2, date, time, due, blk, rec, rem, desc, hist:[]}
          tag = task list NAME (key in L); gl = Google task list id. p: 0 To do, 1 Started, 2 Done.
          date = the task's day (Google 'due'), time = time of day in hours (null = all-day task), due = deadline.
          rec = repeat rule text ('none', 'daily', 'weekly', 'weekly on Mon,Wed', 'every 2 weeks', 'monthly', 'yearly').
          rem = reminder, minutes before (null = none). desc = the user's own note text. hist = log lines of earlier plans.
          blk = local id of the event the task is time-blocked into.
          NOTES FORMAT (TasksBoard style): time, repeat and reminder are saved as hidden lines at the bottom of the Google notes field:
          '⏰ HH:MM', '🔁 <rule>', '🔔 <minutes>' (plus '⚑ <deadline>', 'Status: ...', 'Moved from ...', '📅 <event id>'). See taskToGoogle/taskFromGoogle.
   NOTE   {id, t, tag, ts:ms, hold:bool, parent:id|null}   (stored locally + Drive backup, not in Google Calendar/Tasks)
   ========================================================================= */

/* ---- 1. Auth (Google Identity Services) ---------------------------------- */
/* The access token is kept in localStorage (key tempo.auth) together with its expiry time, so the app starts without a new login
   while the token is valid (about 1 hour). No refresh token is stored. SECURITY: anything running on this page can read localStorage,
   so load no third-party scripts besides Google's and use the "Sign out" button in Settings on shared devices. */
const AUTH_KEY='tempo.auth';
let _token=null,_tokenExp=0,_authPromise=null,dataLoaded=false;
function loadStoredToken(){
  try{const o=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
    if(o&&o.token&&o.exp>Date.now()){_token=o.token;_tokenExp=o.exp}else if(o)localStorage.removeItem(AUTH_KEY)}catch(e){}
}
function storeToken(tok,expiresIn){
  _token=tok;_tokenExp=Date.now()+(expiresIn-60)*1000;   /* renew 60 s before Google says it expires */
  try{localStorage.setItem(AUTH_KEY,JSON.stringify({token:_token,exp:_tokenExp}))}catch(e){}
}
function clearToken(){_token=null;_tokenExp=0;try{localStorage.removeItem(AUTH_KEY)}catch(e){}}
function waitForGoogle(ms=5000){
  return new Promise((res,rej)=>{
    if(window.google&&google.accounts)return res();
    const t0=Date.now(),iv=setInterval(()=>{
      if(window.google&&google.accounts){clearInterval(iv);res()}
      else if(Date.now()-t0>ms){clearInterval(iv);rej(new Error('Google sign-in script timed out (tjek internet/AdBlocker)'))}
    },100);
  });
}
function requestToken(prompt){   /* prompt '' = no extra screens when Google already has your consent; works without a popup when the browser allows it */
  return new Promise(async(resolve,reject)=>{
    try{await waitForGoogle()}catch(e){return reject(e)}
    if(GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID')===0)return reject(new Error('Set GOOGLE_CLIENT_ID first'));
    const client=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:GOOGLE_SCOPES,
      callback:r=>{if(r.error)return reject(new Error(r.error));storeToken(r.access_token,r.expires_in);hideLoginButton();resolve(_token)},
      error_callback:e=>reject(new Error((e&&e.type)||'popup_closed'))   /* popup blocked or closed */
    });
    client.requestAccessToken({prompt:prompt||''});
  });
}
function showLoginButton(){
  if(document.getElementById('g-login-btn'))return;
  const btn=document.createElement('button');
  btn.id='g-login-btn';
  btn.className='btn';
  btn.style.cssText='margin:12px 16px;width:calc(100% - 32px);background:#2F6FED;color:#fff';
  btn.textContent='Log ind med Google';
  btn.onclick=signIn;   /* a tap is a user gesture, so the browser allows the Google popup */
  document.querySelector('header').after(btn);
}
function hideLoginButton(){const b=document.getElementById('g-login-btn');if(b)b.remove()}
async function signIn(){
  try{await requestToken('');hideLoginButton();if(dataLoaded)toast('Signed in');else initData()}
  catch(e){toast('Login failed: '+e.message)}
}
function signOut(){
  const t=_token;clearToken();
  try{if(t&&window.google&&google.accounts)google.accounts.oauth2.revoke(t,()=>{})}catch(e){}
  if(!USE_DUMMY_DATA)showLoginButton();
  toast('Signed out');
}
function getAccessToken(){
  if(_token&&Date.now()<_tokenExp)return Promise.resolve(_token);
  if(_authPromise)return _authPromise;   /* several calls share ONE refresh attempt */
  _authPromise=requestToken('').catch(e=>{clearToken();showLoginButton();throw new Error('auth: '+e.message)}).finally(()=>{_authPromise=null});
  return _authPromise;
}
async function authFetch(url,opts={}){   /* fetch with the bearer token; on 401 the token is dropped, renewed once and the call repeated */
  for(let attempt=0;attempt<2;attempt++){
    const token=await getAccessToken();
    const res=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}});
    if(res.status!==401)return res;
    clearToken();
  }
  throw new Error('auth: still 401 Unauthorized after renewing the token');
}
async function googleRequest(method,url,body){
  if(DRY_RUN&&method!=='GET'){console.log('[DRY_RUN] '+method+' '+url,body||'');return{id:'dry-'+Math.random().toString(36).slice(2,9),dryRun:true}}
  const res=await authFetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error('Google API '+res.status+' on '+method+' '+url);
  return res.status===204?null:res.json();
}
function syncFail(e){console.error(e);if(/^auth/.test(e.message))return;toast('Sync failed: '+e.message)}   /* sign-in problems show the login button instead of a toast */

/* ---- 3. Mapping between app objects and Google payloads ------------------ */
function tzDateTime(day,h){  /* local wall time with UTC offset, e.g. 2026-11-14T10:00:00+01:00 */
  const d=new Date(day+'T'+t24(h)+':00'),o=-d.getTimezoneOffset(),a=Math.abs(o),p=n=>String(n).padStart(2,'0');
  return day+'T'+t24(h)+':00'+(o>=0?'+':'-')+p(Math.floor(a/60))+':'+p(a%60);
}
function eventToGoogle(e){
  const g={summary:e.t,location:e.loc||'',description:e.desc||''},ed=e.endDay&&e.endDay>e.day?e.endDay:e.day;   /* ed = inclusive last day */
  if(e.allDay){g.start={date:e.day};g.end={date:iso(add(P(ed),1))}}            /* Google all-day end date is exclusive */
  else{const toMidnight=e.e>=24;g.start={dateTime:tzDateTime(e.day,e.s)};g.end={dateTime:tzDateTime(toMidnight?iso(add(P(ed),1)):ed,toMidnight?0:e.e)}}
  if(!e.rid&&e.rec&&e.rec!='none'){const rr=rruleOf(e.rec,e.allDay);if(rr){g.recurrence=[rr];if(!e.allDay){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;g.start.timeZone=tz;g.end.timeZone=tz}}}   /* Google requires timeZone on recurring timed events; instances (rid) never resend a rule */
  if(e.rem!==undefined)g.reminders={useDefault:false,overrides:e.rem===null?[]:[{method:'popup',minutes:e.rem}]};   /* undefined = leave Google's default reminders alone */
  return g;
}
function remFromGoogle(g){   /* minutes of the first popup reminder; null = no reminder; undefined = Google's default */
  if(!g.reminders||g.reminders.useDefault)return undefined;
  const o=g.reminders.overrides||[],p=o.find(r=>r.method=='popup')||o[0];return p?p.minutes:null;
}
function eventFromGoogle(g,cal){
  const allDay=!!g.start.date;let day,s=0,e=24,endDay;
  if(allDay){day=g.start.date;endDay=iso(add(P((g.end&&g.end.date)||day),-1));if(endDay<day)endDay=day}   /* Google's all-day end is exclusive */
  else{const a=new Date(g.start.dateTime),b=new Date(g.end.dateTime);day=iso(a);s=a.getHours()+a.getMinutes()/60;const eh=b.getHours()+b.getMinutes()/60,bd=iso(b);if(bd==day){e=eh;endDay=day;if(e===0)e=24}else if(eh===0){endDay=iso(add(b,-1));if(endDay<day)endDay=day;e=24}else{endDay=bd;e=eh}}
  return{id:id++,gid:g.id,t:g.summary||'(No title)',cal,day,endDay,s,e,allDay,rid:g.recurringEventId||null,rem:remFromGoogle(g),rec:'none',loc:g.location||'',desc:g.description||''};
}
function taskToGoogle(t){
  /* TasksBoard-style: Google Tasks 'due' (a date) = the task's date. Everything else lives in the notes field:
     the user's own note text first, then hidden metadata lines at the BOTTOM:
       Status: <To do|Started|Done>     progress (Tempo)
       Moved from ...                   history of earlier plans (Tempo)
       ⚑ YYYY-MM-DD                    deadline (Tempo)
       ⏰ HH:MM                         time of day (24 h)
       🔁 <rule>                        repeat: daily | weekly | weekly on Mon,Wed | every 2 weeks | monthly | yearly
       🔔 <minutes>                     reminder, minutes before
       📅 <event id>                    the Google Calendar event the task is time-blocked into (Tempo) */
  const n=[];
  if(t.desc&&t.desc.trim())n.push(t.desc.trim());
  n.push('Status: '+PN[t.p]);
  (t.hist||[]).forEach(h=>n.push(h));
  n.push('📆 '+(t.date||'-'));   /* planned date (Tempo); Google's due field now holds the DEADLINE */
  if(t.time!=null&&!t.blk)n.push('⏰ '+t24(t.time));
  if(t.rec&&t.rec!='none')n.push('🔁 '+t.rec);
  if(t.sid)n.push('Series: '+t.sid);if(t.occ)n.push('Occurrence: '+t.occ);if(t.stime!=null)n.push('STime: '+t24(t.stime));if(t.skip&&t.skip.length)n.push('Skip: '+t.skip.join(','));   /* repeat series id, original date of this occurrence, skipped dates */
  if(t.blk){const ev=events.find(x=>x.id==t.blk);if(ev&&ev.gid)n.push('📅 '+ev.gid)}
  const g={title:(t.icon?t.icon+' ':'')+t.t,notes:n.join('\n'),status:t.p==2?'completed':'needsAction',due:t.due?t.due+'T00:00:00.000Z':null};   /* Tasks API: date only, time part is ignored; null clears it */   /* icon is written in FRONT of the task name */
  if(t.p<2)g.completed=null;
  return g;
}
function taskFromGoogle(g,tag,listId){
  const desc=[],hist=[],meta={};
  (g.notes||'').split(/\r?\n/).forEach(l=>{const x=l.trim();
    const m=x.match(/^(⏰|🔁|🔔|⚑|📅|📆)\uFE0F?\s*(.*)$/u);
    if(m){meta[m[1]]=m[2].trim();return}
    const sm=x.match(/^(Series|Occurrence|Skip|STime):\s*(.*)$/i);if(sm){meta['s_'+sm[1].toLowerCase()]=sm[2].trim();return}
    if(/^Status:/i.test(x)){meta.status=x.replace(/^Status:\s*/i,'');return}
    if(x.startsWith('Moved from ')){hist.push(x);return}
    desc.push(l)});                        /* everything else is the user's own note */
  while(desc.length&&!desc[desc.length-1].trim())desc.pop();
  const gd=g.due?g.due.slice(0,10):null,st=meta.status||'To do',p=g.status=='completed'?2:Math.min(1,Math.max(0,PN.findIndex(x=>x.toLowerCase()==st.toLowerCase())));
  let date=gd,time=null,due=null,newFmt=!!meta['📆'],rec='none',rem=null,blkGid=null;
  const tm=(meta['⏰']||'').match(/^(\d{1,2}):(\d{2})/);if(tm)time=+tm[1]+tm[2]/60;
  if(meta['🔁'])rec=meta['🔁'];
  if(/^\d+$/.test(meta['🔔']||''))rem=+meta['🔔'];
  if(newFmt){const pd=meta['📆'];date=/^\d{4}-\d{2}-\d{2}$/.test(pd)?pd:null;due=gd}   /* new format: Google due = deadline */
  else if(/^\d{4}-\d{2}-\d{2}$/.test(meta['⚑']||''))due=meta['⚑'];   /* legacy: due = planned date, deadline in notes */
  if(meta['📅'])blkGid=meta['📅'];
  let icon='',title=g.title||'';const ic0=['📞','⚠️'].find(i=>title.startsWith(i+' '));if(ic0){icon=ic0;title=title.slice(ic0.length+1)}
  return{id:id++,gid:g.id,gl:listId,t:title,tag,icon,p,stime:(()=>{const q=(meta.s_stime||'').match(/^(\d{1,2}):(\d{2})/);return q?+q[1]+q[2]/60:null})(),doneAt:g.completed?Date.parse(g.completed)||null:null,date,time,blk:null,blkGid,rec,rem,due,sid:meta.s_series||null,occ:/^\d{4}-\d{2}-\d{2}$/.test(meta.s_occurrence||'')?meta.s_occurrence:null,skip:(meta.s_skip||'').split(',').filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)),desc:desc.join('\n'),hist};
}

/* ---- 4. READ: calendars, task lists, events, tasks ----------------------- */
async function fetchCalendars(){
  if(USE_DUMMY_DATA)return dummyCalendars();
  const r=await googleRequest('GET','https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=writer');
  const out={};calIds={};r.items.forEach(c=>{out[c.summary]=c.backgroundColor;calIds[c.summary]=c.id});return out;
}
async function fetchTaskLists(){
  if(USE_DUMMY_DATA)return dummyTaskLists();
  const def=await googleRequest('GET','https://tasks.googleapis.com/tasks/v1/users/@me/lists/@default');
  const r=await googleRequest('GET','https://tasks.googleapis.com/tasks/v1/users/@me/lists?maxResults=100');
  const pal=['#2F6FED','#14A38B','#E8590C','#9B51E0','#D6409F','#0EA5C6','#7A8B1F','#C7842B'],out={},old=L;listIds={};let k=0;
  r.items.forEach(l=>{const name=l.id==def.id?'Uncategorized':l.title;out[name]=old[name]||(name=='Uncategorized'?'#6B7587':pal[k++%pal.length]);listIds[name]=l.id});
  return out;   /* the default Google list is shown as "Uncategorized" / N/C */
}
async function fetchCalendarEvents(){
  if(USE_DUMMY_DATA)return dummyEvents();
  const min=encodeURIComponent(add(TODAY,-31).toISOString()),max=encodeURIComponent(add(TODAY,120).toISOString()),out=[];
  for(const name of Object.keys(CAL)){
    /* singleEvents=true expands recurring events into separate instances. TODO: follow nextPageToken if you have >250 events. */
    const r=await googleRequest('GET','https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[name])+'/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+min+'&timeMax='+max);
    (r.items||[]).filter(g=>g.status!='cancelled').forEach(g=>out.push(eventFromGoogle(g,name)));
  }
  return out;
}
async function fetchTasks(){
  if(USE_DUMMY_DATA)return dummyTasks();
  const out=[];
  for(const tag of Object.keys(L)){
    if(!listIds[tag])continue;
    const r=await googleRequest('GET','https://tasks.googleapis.com/tasks/v1/lists/'+listIds[tag]+'/tasks?showCompleted=true&showHidden=true&maxResults=100');
    (r.items||[]).forEach(g=>out.push(taskFromGoogle(g,tag,listIds[tag])));
  }
  return out;
}

/* ---- 5. WRITE: create / update / delete ONE item at a time (respects DRY_RUN) ---- */
async function createCalendarEvent(e){
  try{const r=await googleRequest('POST','https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[e.cal]||'primary')+'/events',eventToGoogle(e));e.gid=r.id}catch(x){syncFail(x)}
  return e;
}
async function updateCalendarEvent(e){
  if(!e.gid&&!DRY_RUN)return e;   /* only events that exist in Google can be patched */
  if(e.rid&&e.rec&&e.rec!='none'){try{await googleRequest('PATCH','https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[e.cal]||'primary')+'/events/'+e.rid,{recurrence:[rruleOf(e.rec,e.allDay)]});e.rec='none';toast('Series rule updated in Google Calendar')}catch(x){syncFail(x)}}   /* new rule for the whole series = patch the master event */
  try{await googleRequest('PATCH','https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[e.cal]||'primary')+'/events/'+(e.gid||'DRY'),eventToGoogle(e))}catch(x){syncFail(x)}
  return e;   /* NOTE: changing the calendar of an existing event needs events.move - not implemented */
}
async function deleteCalendarEvent(e){   /* ONE event the user chose to delete */
  if(!e.gid&&!DRY_RUN)return;
  try{await googleRequest('DELETE','https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[e.cal]||'primary')+'/events/'+(e.gid||'DRY'))}catch(x){syncFail(x)}
}
async function createTaskList(name){
  try{const r=await googleRequest('POST','https://tasks.googleapis.com/tasks/v1/users/@me/lists',{title:name});listIds[name]=r.id}catch(x){syncFail(x)}
}
async function createTask(t){
  try{
    if(!listIds[t.tag])await createTaskList(t.tag);
    const r=await googleRequest('POST','https://tasks.googleapis.com/tasks/v1/lists/'+(listIds[t.tag]||'@default')+'/tasks',taskToGoogle(t));
    t.gid=r.id;t.gl=listIds[t.tag];
  }catch(x){syncFail(x)}
  return t;
}
async function updateTask(t){
  if(!t.gid&&!DRY_RUN)return t;
  try{
    if(t.gl&&listIds[t.tag]&&t.gl!==listIds[t.tag]){   /* tag changed: Google cannot move a task between lists with PATCH -> create in the new list, then delete the old copy (one task) */
      const old={gid:t.gid,gl:t.gl};await createTask(t);
      await googleRequest('DELETE','https://tasks.googleapis.com/tasks/v1/lists/'+old.gl+'/tasks/'+old.gid);
    }else await googleRequest('PATCH','https://tasks.googleapis.com/tasks/v1/lists/'+(t.gl||'@default')+'/tasks/'+(t.gid||'DRY'),taskToGoogle(t));
  }catch(x){syncFail(x)}
  return t;
}
async function deleteTask(t){   /* ONE task the user chose to delete */
  if(!t.gid&&!DRY_RUN)return;
  try{await googleRequest('DELETE','https://tasks.googleapis.com/tasks/v1/lists/'+(t.gl||'@default')+'/tasks/'+(t.gid||'DRY'))}catch(x){syncFail(x)}
}

/* ---- 5b. Repeating events: delete ONE occurrence / this and following / the whole series ---- */
function calUrl(cal){return 'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calIds[cal]||'primary')+'/events'}
async function deleteCalendarInstance(e,day){   /* one occurrence of a repeating event that was created by this app */
  if(!e.gid&&!DRY_RUN)return;
  if(DRY_RUN){console.log('[DRY_RUN] DELETE one occurrence of '+(e.gid||'DRY')+' on '+day);return}
  try{const a=encodeURIComponent(new Date(day+'T00:00').toISOString()),b=encodeURIComponent(new Date(iso(add(P(day),1))+'T00:00').toISOString());
    const r=await googleRequest('GET',calUrl(e.cal)+'/'+e.gid+'/instances?timeMin='+a+'&timeMax='+b);
    if(r.items&&r.items[0])await googleRequest('DELETE',calUrl(e.cal)+'/'+r.items[0].id)}catch(x){syncFail(x)}
}
async function endCalendarSeries(e,from){   /* "this and following": cut the series off BEFORE `from` (needs day, s, allDay) */
  const master=e.rid||e.gid;if(!master&&!DRY_RUN)return;
  if(DRY_RUN){console.log('[DRY_RUN] PATCH recurrence of '+(master||'DRY')+' so it ends before '+from.day);return}
  try{const m=await googleRequest('GET',calUrl(e.cal)+'/'+master),start=new Date(from.allDay?from.day+'T00:00':tzDateTime(from.day,from.s));
    if(new Date(m.start.dateTime||(m.start.date+'T00:00'))>=start){await googleRequest('DELETE',calUrl(e.cal)+'/'+master);return}   /* cut at/before the first occurrence = whole series */
    const until=from.allDay?iso(add(P(from.day),-1)).replace(/-/g,''):new Date(start.getTime()-1000).toISOString().replace(/[-:]|\.\d{3}/g,'');
    const rec=(m.recurrence||[]).map(r=>r.startsWith('RRULE:')?r.replace(/;?(UNTIL|COUNT)=[^;]*/g,'')+';UNTIL='+until:r);
    await googleRequest('PATCH',calUrl(e.cal)+'/'+master,{recurrence:rec})}catch(x){syncFail(x)}
}
async function deleteCalendarSeries(e){   /* "all events": the single master event of the series */
  const master=e.rid||e.gid;if(!master&&!DRY_RUN)return;
  try{await googleRequest('DELETE',calUrl(e.cal)+'/'+(master||'DRY'))}catch(x){syncFail(x)}
}

/* ---- 6. Google Drive: notes backup (ONE file, always overwritten in place) ---- */
async function findBackupFileId(token){
  const r=await authFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("name='"+BACKUP_FILE+"' and trashed=false")+'&fields=files(id)&pageSize=1',{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:null;
}
async function backupNotesToDrive(){
  const md=notesToMarkdown();

function save(){const sn0=snapState();snap();const t=F.t.trim(),k=F.kind;if(!t)return toast('Add some text');let tag=F.tag,msg='';const nt=(F.nt||'').trim();if(k=='task'&&nt&&!L[nt]&&!F.okNew){sheet(`<h2>Create new category?</h2><div class="sd" style="margin-bottom:14px">“${esc(nt)}” does not exist yet. Adding this task also creates a new list “${esc(nt)}” in Google Tasks.</div><div class="row"><button class="btn alt" onclick="redraw()">Cancel</button><button class="btn" style="flex:1;width:auto" onclick="F.okNew=true;save()">Create and add</button></div>`);return}

if(k=='task'){const o=F.id&&tasks.find(x=>x.id==F.id),d=F.d||(F.rec!='none'?iso(TODAY):null),tm=d&&F.s?hh(F.s):null;
if(o){const was0=o.p;logMove(o,d,tm);if(o.blk&&o.date!=d)o.blk=null;Object.assign(o,{t,tag,icon:F.icon,p:F.p,date:d,time:tm,rec:F.rec,due:F.due||null,desc:F.desc.trim(),rem:F.rem===''?null:+F.rem});if(o.rec!='none'){o.sid=o.sid||newSid();o.occ=o.occ||o.date}if(o.p==2&&was0!=2)o.doneAt=Date.now();if(o.p==2&&was0!=2&&o.rec!='none')spawnNext(o);updateTask(o)}else{const nw={id:id++,t,tag,icon:F.icon,p:F.p,date:d,time:tm,blk:null,rec:F.rec,sid:F.rec!='none'?newSid():null,occ:F.rec!='none'?d:null,due:F.due||null,desc:F.desc.trim(),rem:F.rem===''?null:+F.rem};tasks.unshift(nw);createTask(nw)}}
else if(k=='event'){const ad=F.allDay,s=ad?0:hh(F.s),e=ad?24:hh(F.e);const ed=F.ed&&F.ed>F.d?F.ed:F.d;if(F.ed&&F.d&&F.ed<F.d)return toast('End date cannot be before the start date');if(ed>F.d&&F.rec&&F.rec!='none')return toast('Multi-day events cannot repeat');if((!ad&&ed==F.d&&!(e>s))||!F.d)return toast('Check date and times');const v={t,cal:F.cal,day:F.d,endDay:ed,s,e,allDay:ad,rec:F.rec,loc:F.loc.trim(),desc:F.desc.trim(),rem:F.rem=='d'?undefined:(F.rem===''?null:+F.rem)},o=F.id&&events.find(x=>x.id==F.id);let ev=o;
let evP=null;if(o){Object.assign(o,v);updateCalendarEvent(o)}else{ev={id:id++,...v};events.push(ev);evP=createCalendarEvent(ev)}

assignTasksToEvent(ev,ad?[]:[...F.tasks,...fresh.map(x=>x.id)],evP,fresh)}

close_();synced(k=='note'?(lastN>1?lastN+' notes created':'Note saved'):'Saved & synced to Google '+(k=='task'?'Tasks':'Calendar')+msg+(F.from?' · note removed':''),undoTo(sn0));render()}
let curOcc=null,pendingDel=[],delTimer=null;
function commitDeletes(){clearTimeout(delTimer);const q=pendingDel;pendingDel=[];q.forEach(f=>f())}
function queueDelete(fns){pendingDel.push(...fns);clearTimeout(delTimer);delTimer=setTimeout(commitDeletes,6500)}   /* Google is only told after the undo window has passed */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')commitDeletes()});
function del(){const k=F.kind;
  if(k=='event'){const e=events.find(x=>x.id==F.id);if(e&&(e.rid||(e.rec&&e.rec!='none')))return promptDelete(e,'event')}
  if(k=='task'){const t=tasks.find(x=>x.id==F.id);if(t&&t.rec&&t.rec!='none')return promptDelete(t,'task')}
  removeItems(k,F.id,'this')}
function promptDelete(item,type){   /* exactly three choices, like Google Calendar / Google Tasks */
  const ev=type=='event',o=[['this','This instance',ev?'Removes only this occurrence':'Moves the task to its next date'],['following','This and following instances',ev?'The series ends before this one':'Deletes the task and all future repeats'],['all','All instances in the series',ev?'Removes the whole series':'Deletes the task']];
  sheet(`<h2>Delete repeating ${ev?'event':'task'}</h2><div class="sd" style="margin:-2px 0 12px">${esc(item.t)}</div>${o.map(([m,l,h])=>`<button class="btn alt delopt" onclick="removeItems('${type}',${item.id},'${m}')"><b>${l}</b><span>${h}</span></button>`).join('')}`)}
function removeItems(kind,i,mode){const sn=snapState(),fns=[],relink=[];
  if(kind=='task'){const t=tasks.find(x=>x.id==i);if(!t)return;
    if(mode=='this'&&t.rec&&t.rec!='none'&&t.date){   /* "this instance": the task stays and moves to its next occurrence */
      skipTo(t);updateTask(t);close_();render();
      toast('Moved to next occurrence ('+dl(t.date)+')',()=>{undoTo(sn)();const t0=tasks.find(x=>x.id==i);if(t0)updateTask(t0)});return}
    tasks=tasks.filter(x=>x!==t);fns.push(()=>deleteTask(t));   /* "this and following" / "all": the task is deleted */
  }else{const e=events.find(x=>x.id==i);if(!e)return;let rem=[e],gone=[];
    const od=e.rid?e.day:(curOcc&&evOn(P(curOcc)).includes(e)?curOcc:e.day);
    if(e.rid){const series=events.filter(x=>x.rid==e.rid&&x.cal==e.cal);
      if(mode=='this')fns.push(()=>deleteCalendarEvent(e));
      else if(mode=='following'){rem=series.filter(x=>x.day>e.day||(x.day==e.day&&x.s>=e.s));fns.push(()=>endCalendarSeries(e,e))}
      else{rem=series;fns.push(()=>deleteCalendarSeries(e))}
    }else if(e.rec&&e.rec!='none'&&mode=='this'){rem=[];e.ex=[...(e.ex||[]),od];fns.push(()=>deleteCalendarInstance(e,od));if(od==e.day)gone=[e.id]}
    else if(e.rec&&e.rec!='none'&&mode=='following'&&od>e.day){rem=[];e.until=iso(add(P(od),-1));fns.push(()=>endCalendarSeries(e,{day:od,s:e.s,allDay:e.allDay,cal:e.cal}))}
    else fns.push(()=>deleteCalendarEvent(e));
    gone=gone.concat(rem.map(x=>x.id));
    if(isRecEv(e)){   /* repeating event: its tasks go with it (this instance / this and following / whole series) */
      const ids=e.rid?events.filter(x=>x.rid==e.rid&&x.cal==e.cal).map(x=>x.id):[e.id],gone2=new Set();
      tasks.filter(t=>ids.includes(t.blk)).forEach(t=>{const open=t.p<2&&t.rec&&t.rec!='none'&&t.sid;
        if(mode=='all'){gone2.add(t);return}
        if(mode=='this'){if(t.date==od){if(open&&nextOcc(t)<'9999'){skipTo(t);const be=blkEvFor(t,t.date);t.blk=be?be.id:null;relink.push(t.id);updateTask(t)}else gone2.add(t)}else if(open&&t.date<od&&!(t.skip||[]).includes(od)){t.skip=[...(t.skip||[]),od];relink.push(t.id);updateTask(t)}return}
        if(t.date&&t.date>=od){gone2.add(t);return}   /* following */
        if(open){const u=parseRule(t.rec);if(u){u.until=iso(add(P(od),-1));t.rec=recBuild(u);relink.push(t.id);updateTask(t)}}});
      gone2.forEach(t=>fns.push(()=>deleteTask(t)));tasks=tasks.filter(t=>!gone2.has(t));
    }
    tasks.forEach(t=>{if(gone.includes(t.blk)){relink.push(t.id);t.blk=null;updateTask(t)}});
    events=events.filter(x=>!rem.includes(x));
  }
  close_();render();queueDelete(fns);
  toast(DRY_RUN?'Deleted (dry run)':'Deleted',()=>{pendingDel=pendingDel.filter(f=>!fns.includes(f));undoTo(sn)();relink.forEach(r=>{const t=tasks.find(x=>x.id==r);if(t)updateTask(t)})})}

},{passive:true});
